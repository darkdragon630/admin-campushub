<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahasiswa — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
</head>
<body class="app-page">
  <!-- Hamburger (mobile only) -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>


  <div class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.svg" alt="logo">
      <h2>CampusHub</h2>
    </div>
    <div class="nav-section">Menu Utama</div>
    <ul>
      <li onclick="location.href='dashboard.html'"><span class="nav-icon">📊</span> Dashboard</li>
      <li onclick="location.href='pengumuman.html'"><span class="nav-icon">📢</span> Pengumuman</li>
      <li onclick="location.href='forum.html'"><span class="nav-icon">💬</span> Forum</li>
      <li class="active"><span class="nav-icon">👥</span> Mahasiswa</li>
      <li class="logout" onclick="logout()"><span class="nav-icon">🚪</span> Logout</li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Data Mahasiswa</h1>
        <p class="page-subtitle">Kelola seluruh akun mahasiswa terdaftar</p>
      </div>
    </div>

    <div class="section-header">
      <h2>Daftar Mahasiswa</h2>
    </div>

    <div class="list-grid" id="mahasiswaList">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    async function loadMahasiswa() {
      const { data } = await supabaseClient.from('users').select('*').eq('role', 'mahasiswa');
      const el = document.getElementById('mahasiswaList');
      if (!data || !data.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">👥</div><p>Belum ada mahasiswa terdaftar.</p></div>';
        return;
      }
      el.innerHTML = data.map((item, i) => `
        <div class="jadwal-card" style="animation-delay:${i*.05}s">
          <div style="width:40px;height:40px;border-radius:50%;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#4f46e5;flex-shrink:0">
            ${(item.nama||'?').charAt(0).toUpperCase()}
          </div>
          <div class="jadwal-card-body">
            <h3>${item.nama || '(tanpa nama)'}</h3>
            <p>${item.email}</p>
            ${item.nim ? `<p style="font-size:12px;color:var(--muted2);margin-top:2px">NIM: ${item.nim}</p>` : ''}
            <span class="tag tag-indigo">🎓 Mahasiswa</span>
          </div>
          <button class="btn-danger" onclick="hapusMahasiswa(${item.id})">Hapus</button>
        </div>`).join('');
    }

    async function hapusMahasiswa(id) {
      if (!confirm('Hapus mahasiswa ini?')) return;
      await supabaseClient.from('users').delete().eq('id', id);
      loadMahasiswa();
    }

    async function logout() {
      const ssidPlain = localStorage.getItem('ssid')
      if (ssidPlain) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ssidPlain))
          const ssidHashed = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
          await supabaseClient.from('users').update({ ssid: null, expired_at: null }).eq('ssid', ssidHashed)
        } catch(e) { console.error('logout:', e) }
      }
      localStorage.removeItem('ssid')
      location.href = 'login.html'
    }
    loadMahasiswa();
  </script>
  <script>
    // ── Sidebar mobile toggle ──
    const btn      = document.getElementById('hamburgerBtn')
    const sidebar  = document.querySelector('.sidebar')
    const overlay  = document.getElementById('sidebarOverlay')

    function openSidebar() {
      sidebar.classList.add('open')
      overlay.classList.add('open')
      btn.classList.add('open')
      document.body.style.overflow = 'hidden'
    }

    function closeSidebar() {
      sidebar.classList.remove('open')
      overlay.classList.remove('open')
      btn.classList.remove('open')
      document.body.style.overflow = ''
    }

    btn?.addEventListener('click', () =>
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
    )
    overlay?.addEventListener('click', closeSidebar)

    // Tutup sidebar saat nav item diklik di mobile
    document.querySelectorAll('.sidebar li').forEach(li =>
      li.addEventListener('click', () => {
        if (window.innerWidth <= 768) closeSidebar()
      })
    )
  </script>
</body>
</html>
