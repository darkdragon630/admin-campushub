<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mahasiswa — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* ── Search bar ── */
    .search-wrap {
      position: relative;
      margin-bottom: 20px;
    }
    .search-wrap .search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      pointer-events: none;
    }
    .search-wrap input {
      width: 100%;
      padding: 11px 14px 11px 40px;
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 14px;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    .search-wrap input:focus {
      border-color: var(--indigo2);
      box-shadow: 0 0 0 3px rgba(139,92,246,0.1);
    }

    /* ── Counter badge ── */
    .count-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: #ede9fe;
      color: #5b21b6;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 700;
    }

    /* ── Realtime new badge ── */
    @keyframes newBadge {
      0%   { opacity:0; transform: scale(.7); }
      60%  { transform: scale(1.1); }
      100% { opacity:1; transform: scale(1); }
    }
    .badge-new {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      background: #dcfce7;
      color: #15803d;
      border-radius: 100px;
      font-size: 10px;
      font-weight: 700;
      margin-left: 8px;
      animation: newBadge .4s ease both;
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/session.js" defer></script><!-- ← guard: redirect ke login jika sesi tidak valid -->
</head>
<body class="app-page">

  <!-- Hamburger (mobile only) -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <div class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.svg" alt="logo">
      <h2>CampusHub</h2>
    </div>
    <div class="nav-section">Menu Utama</div>
    <ul>
      <li onclick="location.href='dashboard.html'"><span class="nav-icon">📊</span> Dashboard</li>
      <li onclick="location.href='pengumuman.html'"><span class="nav-icon">📢</span> Pengumuman</li>
      <li onclick="location.href='forum.html'"><span class="nav-icon">💬</span> Forum</li>
      <li class="active"><span class="nav-icon">👥</span> Mahasiswa</li>
      <li class="logout" onclick="logout()"><span class="nav-icon">🚪</span> Logout</li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Data Mahasiswa</h1>
        <p class="page-subtitle">Kelola seluruh akun mahasiswa terdaftar</p>
      </div>
    </div>

    <!-- Search -->
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari nama atau NIM mahasiswa...">
    </div>

    <!-- Header list -->
    <div class="section-header">
      <h2>Daftar Mahasiswa</h2>
      <span class="count-badge" id="countBadge">0 mahasiswa</span>
    </div>

    <div class="list-grid" id="mahasiswaList">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    let allMahasiswa = []  // data asli dari DB
    let newIds = new Set() // id mahasiswa yang baru masuk via realtime

    /* ── Render berdasarkan keyword search ── */
    function renderList(keyword = '') {
      const el = document.getElementById('mahasiswaList')
      const kw = keyword.toLowerCase().trim()

      const filtered = kw
        ? allMahasiswa.filter(m =>
            (m.nama||'').toLowerCase().includes(kw) ||
            (m.nim||'').toLowerCase().includes(kw) ||
            (m.email||'').toLowerCase().includes(kw)
          )
        : allMahasiswa

      // Update counter
      document.getElementById('countBadge').textContent =
        `${filtered.length} mahasiswa`

      if (!filtered.length) {
        el.innerHTML = kw
          ? `<div class="empty-state"><div class="empty-icon">🔍</div><p>Tidak ada mahasiswa dengan kata kunci "<strong>${keyword}</strong>"</p></div>`
          : '<div class="empty-state"><div class="empty-icon">👥</div><p>Belum ada mahasiswa terdaftar.</p></div>'
        return
      }

      el.innerHTML = filtered.map((item, i) => `
        <div class="jadwal-card" style="animation-delay:${i*.04}s">
          <div style="width:42px;height:42px;border-radius:50%;background:#ede9fe;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:700;color:#5b21b6;flex-shrink:0">
            ${(item.nama||'?').charAt(0).toUpperCase()}
          </div>
          <div class="jadwal-card-body">
            <h3>
              ${item.nama || '(tanpa nama)'}
              ${newIds.has(item.id) ? '<span class="badge-new">● Baru</span>' : ''}
            </h3>
            <p>${item.email || ''}</p>
            ${item.nim ? `<p style="font-size:12px;color:var(--muted2);margin-top:2px">NIM: ${item.nim}</p>` : ''}
            <span class="tag tag-indigo">🎓 Mahasiswa</span>
          </div>
          <button class="btn-danger" onclick="hapusMahasiswa(${item.id})">Hapus</button>
        </div>`).join('')
    }

    /* ── Load dari DB ── */
    async function loadMahasiswa() {
      const { data, error } = await supabaseClient
        .from('users')
        .select('id, nama, nim, email, role')
        .eq('role', 'mahasiswa')
        .order('id', { ascending: false })

      if (error) { console.error(error); return }
      allMahasiswa = data || []
      renderList(document.getElementById('searchInput').value)
    }

    /* ── Hapus mahasiswa ── */
    async function hapusMahasiswa(id) {
      if (!confirm('Hapus mahasiswa ini? Tindakan ini tidak bisa dibatalkan.')) return
      const { error } = await supabaseClient.from('users').delete().eq('id', id)
      if (error) { alert('Gagal menghapus. Coba lagi.'); return }
      allMahasiswa = allMahasiswa.filter(m => m.id !== id)
      newIds.delete(id)
      renderList(document.getElementById('searchInput').value)
    }

    /* ── Realtime: mahasiswa baru daftar dari APK ── */
    function subscribeRealtime() {
      supabaseClient
        .channel('mahasiswa-changes')
        .on('postgres_changes', {
          event: 'INSERT',
          schema: 'public',
          table: 'users',
          filter: 'role=eq.mahasiswa'
        }, ({ new: user }) => {
          // Tandai sebagai baru
          newIds.add(user.id)
          // Tambah ke atas list
          allMahasiswa.unshift(user)
          renderList(document.getElementById('searchInput').value)
          // Hapus badge "Baru" setelah 30 detik
          setTimeout(() => {
            newIds.delete(user.id)
            renderList(document.getElementById('searchInput').value)
          }, 30_000)
        })
        .on('postgres_changes', {
          event: 'DELETE',
          schema: 'public',
          table: 'users'
        }, ({ old: user }) => {
          allMahasiswa = allMahasiswa.filter(m => m.id !== user.id)
          newIds.delete(user.id)
          renderList(document.getElementById('searchInput').value)
        })
        .subscribe()
    }

    /* ── Search handler ── */
    document.getElementById('searchInput').addEventListener('input', e => {
      renderList(e.target.value)
    })

    /* ── Logout ── */
    async function logout() {
      const ssidPlain = localStorage.getItem('ssid')
      if (ssidPlain) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ssidPlain))
          const ssidHashed = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
          await supabaseClient.from('users').update({ ssid: null, expired_at: null }).eq('ssid', ssidHashed)
        } catch(e) { console.error('logout:', e) }
      }
      localStorage.removeItem('ssid')
      location.href = 'login.html'
    }

    /* ── Init ── */
    loadMahasiswa()
    subscribeRealtime()
  </script>

  <script>
    // ── Sidebar mobile toggle ──
    const btn     = document.getElementById('hamburgerBtn')
    const sidebar = document.querySelector('.sidebar')
    const overlay = document.getElementById('sidebarOverlay')

    function openSidebar() {
      sidebar.classList.add('open')
      overlay.classList.add('open')
      btn.classList.add('open')
      document.body.style.overflow = 'hidden'
    }
    function closeSidebar() {
      sidebar.classList.remove('open')
      overlay.classList.remove('open')
      btn.classList.remove('open')
      document.body.style.overflow = ''
    }

    btn?.addEventListener('click', () =>
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
    )
    overlay?.addEventListener('click', closeSidebar)
    document.querySelectorAll('.sidebar li').forEach(li =>
      li.addEventListener('click', () => { if (window.innerWidth <= 768) closeSidebar() })
    )
  </script>

</body>
</html>
