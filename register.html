<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/register.js" defer></script>
</head>
<body class="auth-page">

  <div class="auth-left">
    <div class="auth-left-blob b1"></div>
    <div class="auth-left-blob b2"></div>
    <div class="auth-left-content">
      <img src="assets/logo.svg" alt="CampusHub Logo">
      <h2>CampusHub</h2>
      <p>Buat akun admin untuk mulai mengelola kampus Anda.</p>
    </div>
  </div>

  <div class="auth-right">
    <div class="auth-form-wrap">

      <div class="auth-mobile-logo">
        <img src="assets/logo.svg" alt="logo">
        <span>CampusHub</span>
      </div>

      <h1>Buat Akun Admin</h1>
      <p class="subtitle">Setup akun admin pertama CampusHub</p>

      <div class="field-group">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Dr. Budi Santoso">
      </div>

      <div class="field-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="admin@kampus.ac.id">
      </div>

      <div class="field-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Minimal 8 karakter">
      </div>

      <button class="btn-primary" onclick="registerAdmin()">Buat Akun →</button>

      <div class="auth-footer">
        Sudah punya akun? <a href="login.html">Masuk di sini</a>
      </div>

    </div>
  </div>

</body>
</html>
