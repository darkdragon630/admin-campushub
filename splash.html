<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1e0a3c;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'Segoe UI', Arial, sans-serif;
      overflow: hidden;
    }

    /* Blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      pointer-events: none;
      z-index: 0;
    }
    .b1 { width:500px;height:500px;background:rgba(124,58,237,.25);top:-150px;left:-150px;animation:drift 9s ease-in-out infinite alternate; }
    .b2 { width:400px;height:400px;background:rgba(139,92,246,.18);bottom:-120px;right:-120px;animation:drift 11s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from{transform:translate(0,0) scale(1)} to{transform:translate(24px,16px) scale(1.08)} }

    /* Logo */
    .splash { position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; }

    .logo-wrap {
      position: relative;
      margin-bottom: 26px;
      animation: popIn .7s cubic-bezier(.34,1.56,.64,1) .1s both;
    }

    .logo-wrap img { width:100px; height:100px; object-fit:contain; display:block; }

    .ring {
      position:absolute; border-radius:50%;
      border: 1.5px solid rgba(139,92,246,.35);
      animation: ringPulse 2.5s ease-in-out infinite;
    }
    .ring1 { inset:-16px; animation-delay:0s; }
    .ring2 { inset:-30px; animation-delay:.5s; opacity:.6; }
    @keyframes ringPulse { 0%,100%{transform:scale(1);opacity:.7} 50%{transform:scale(1.05);opacity:.2} }

    @keyframes popIn { from{opacity:0;transform:scale(.6) translateY(16px)} to{opacity:1;transform:scale(1) translateY(0)} }

    .brand {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.5px;
      animation: fadeUp .5s ease .5s both;
    }
    .brand .campus { color: #f1f5f9; }
    .brand .hub    { color: #a78bfa; }

    .tagline {
      font-size: 12px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(255,255,255,.35);
      margin-top: 6px;
      animation: fadeUp .5s ease .65s both;
    }

    /* Loading bar */
    .bar-wrap {
      width: 160px; height: 3px;
      background: rgba(255,255,255,.08);
      border-radius: 100px;
      margin-top: 44px;
      overflow: hidden;
      animation: fadeUp .4s ease .8s both;
    }
    .bar {
      height: 100%;
      width: 0;
      background: linear-gradient(90deg, #7c3aed, #a78bfa);
      border-radius: 100px;
      animation: fillBar 2s cubic-bezier(.4,0,.2,1) 1s forwards;
    }
    @keyframes fillBar { 0%{width:0} 60%{width:75%} 85%{width:92%} 100%{width:100%} }

    .status {
      font-size: 12px;
      color: rgba(255,255,255,.3);
      margin-top: 12px;
      animation: fadeUp .4s ease .9s both;
      min-height: 18px;
    }

    @keyframes fadeUp { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
<body>
  <div class="blob b1"></div>
  <div class="blob b2"></div>

  <div class="splash">
    <div class="logo-wrap">
      <div class="ring ring1"></div>
      <div class="ring ring2"></div>
      <img src="assets/logo.svg" alt="CampusHub">
    </div>
    <div class="brand"><span class="campus">Campus</span><span class="hub">Hub</span></div>
    <div class="tagline">Connecting Students</div>
    <div class="bar-wrap"><div class="bar"></div></div>
    <div class="status" id="statusText">Memuat sistem...</div>
  </div>

  <!-- Supabase perlu diload di splash agar checkAdmin bisa jalan -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    // Setelah bar selesai (~3 detik), jalankan checkAdmin
    // status text update dinamis
    const steps = [
      { t: 800,  msg: 'Menghubungkan ke server...' },
      { t: 1600, msg: 'Memeriksa akun admin...' },
      { t: 2400, msg: 'Memverifikasi sesi...' },
    ]
    steps.forEach(({ t, msg }) =>
      setTimeout(() => { document.getElementById('statusText').textContent = msg }, t)
    )

    // Jalankan checkAdmin setelah bar animation (2s delay + 1s fill = 3s total)
    setTimeout(checkAdmin, 3100)

    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str))
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
    }

    async function checkAdmin() {
      document.getElementById('statusText').textContent = 'Memeriksa akun...'
      try {
        // 1. Cek keberadaan admin
        const { data: admins } = await supabaseClient
          .from('users').select('id').eq('role','admin').limit(1)

        if (!admins || admins.length === 0) {
          location.href = 'register.html'; return
        }

        // 2. Cek ssid di localStorage
        const ssidPlain = localStorage.getItem('ssid')
        if (!ssidPlain) { location.href = 'login.html'; return }

        document.getElementById('statusText').textContent = 'Memverifikasi sesi...'

        // 3. Hash ssid lalu cek ke DB
        const ssidHashed = await sha256(ssidPlain)

        const { data: user } = await supabaseClient
          .from('users')
          .select('id, role, expired_at')
          .eq('ssid', ssidHashed)
          .eq('role', 'admin')
          .single()

        if (!user) {
          localStorage.removeItem('ssid')
          location.href = 'login.html'
          return
        }

        // 4. Cek expired
        if (!user.expired_at || (() => {
          const utc = user.expired_at.includes('Z') || user.expired_at.includes('+')
            ? user.expired_at : user.expired_at.replace(' ','T') + 'Z'
          return Date.now() > new Date(utc).getTime()
        })()) {
          await supabaseClient.from('users').update({ ssid: null, expired_at: null }).eq('ssid', ssidHashed)
          localStorage.removeItem('ssid')
          location.href = 'login.html'
          return
        }

        location.href = 'dashboard.html'

      } catch(e) {
        console.error(e)
        location.href = 'login.html'
      }
    }
  </script>
</body>
</html>
