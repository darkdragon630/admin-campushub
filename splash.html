<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CampusHub</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080c14;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      font-family: 'DM Sans', sans-serif;
      overflow: hidden;
    }

    /* Background glow blobs */
    .blob {
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      pointer-events: none;
    }
    .blob-1 {
      width: 500px; height: 500px;
      background: rgba(99,102,241,0.2);
      top: -150px; left: -150px;
      animation: blobDrift 8s ease-in-out infinite alternate;
    }
    .blob-2 {
      width: 400px; height: 400px;
      background: rgba(6,182,212,0.15);
      bottom: -120px; right: -120px;
      animation: blobDrift 10s ease-in-out infinite alternate-reverse;
    }
    @keyframes blobDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(30px,20px) scale(1.1); }
    }

    /* Splash content */
    .splash {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    /* Logo */
    .logo-wrap {
      position: relative;
      margin-bottom: 28px;
      animation: logoIn 0.8s cubic-bezier(.34,1.56,.64,1) 0.2s both;
    }

    .logo-wrap img {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      display: block;
    }

    /* Pulsing ring behind logo */
    .logo-ring {
      position: absolute;
      inset: -14px;
      border-radius: 42px;
      border: 2px solid rgba(99,102,241,0.3);
      animation: ringPulse 2.5s ease-in-out 1s infinite;
    }
    .logo-ring-2 {
      position: absolute;
      inset: -28px;
      border-radius: 54px;
      border: 1.5px solid rgba(6,182,212,0.2);
      animation: ringPulse 2.5s ease-in-out 1.4s infinite;
    }

    @keyframes ringPulse {
      0%   { opacity: 0.8; transform: scale(1); }
      50%  { opacity: 0.3; transform: scale(1.05); }
      100% { opacity: 0.8; transform: scale(1); }
    }

    /* Glow behind logo */
    .logo-glow {
      position: absolute;
      inset: -30px;
      border-radius: 60px;
      background: radial-gradient(circle, rgba(99,102,241,0.25) 0%, transparent 70%);
      animation: glowPulse 3s ease-in-out infinite;
    }

    @keyframes glowPulse {
      0%, 100% { opacity: 0.7; transform: scale(1); }
      50%       { opacity: 1;   transform: scale(1.08); }
    }

    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.6) translateY(20px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* Text */
    .brand-name {
      font-family: 'Syne', sans-serif;
      font-size: 36px;
      font-weight: 800;
      color: white;
      letter-spacing: -1px;
      animation: textFadeIn 0.6s ease 0.7s both;
    }

    .brand-sub {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 3.5px;
      text-transform: uppercase;
      color: #475569;
      margin-top: 6px;
      animation: textFadeIn 0.6s ease 0.9s both;
    }

    @keyframes textFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Loading bar */
    .loading-bar-wrap {
      width: 180px;
      height: 3px;
      background: rgba(255,255,255,0.07);
      border-radius: 100px;
      margin-top: 48px;
      overflow: hidden;
      animation: textFadeIn 0.4s ease 1.1s both;
    }

    .loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #6366f1, #06b6d4);
      border-radius: 100px;
      animation: loadFill 2.2s cubic-bezier(.4,0,.2,1) 1.2s forwards;
    }

    @keyframes loadFill {
      0%   { width: 0%; }
      60%  { width: 75%; }
      85%  { width: 90%; }
      100% { width: 100%; }
    }

    .loading-label {
      font-size: 12px;
      color: #334155;
      margin-top: 14px;
      letter-spacing: 0.5px;
      animation: textFadeIn 0.4s ease 1.2s both;
    }
  </style>
</head>
<body>

  <!-- Background blobs -->
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>

  <!-- Splash content -->
  <div class="splash">

    <div class="logo-wrap">
      <div class="logo-glow"></div>
      <div class="logo-ring"></div>
      <div class="logo-ring-2"></div>
      <img src="assets/logo.svg" alt="CampusHub">
    </div>

    <div class="brand-name">CampusHub</div>
    <div class="brand-sub">Connecting Students</div>

    <div class="loading-bar-wrap">
      <div class="loading-bar"></div>
    </div>
    <div class="loading-label">Memuat sistem...</div>

  </div>

  <script>
    // After loading bar finishes, redirect (adjust href as needed)
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 3500);
  </script>

</body>
</html>
