<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengumuman — CampusHub</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/timeHelper.js"></script>
</head>
<body class="app-page">
  <!-- Hamburger (mobile only) -->
  <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu">
    <span></span><span></span><span></span>
  </button>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>


  <div class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.svg" alt="logo">
      <h2>CampusHub</h2>
    </div>
    <div class="nav-section">Menu Utama</div>
    <ul>
      <li onclick="location.href='dashboard.html'"><span class="nav-icon">📊</span> Dashboard</li>
      <li class="active"><span class="nav-icon">📢</span> Pengumuman</li>
      <li onclick="location.href='forum.html'"><span class="nav-icon">💬</span> Forum</li>
      <li onclick="location.href='mahasiswa.html'"><span class="nav-icon">👥</span> Mahasiswa</li>
      <li class="logout" onclick="logout()"><span class="nav-icon">🚪</span> Logout</li>
    </ul>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-left">
        <h1>Pengumuman</h1>
        <p class="page-subtitle">Kelola pengumuman yang tampil ke mahasiswa</p>
      </div>
    </div>

    <div class="form-box">
      <h2>Buat Pengumuman Baru</h2>
      <input type="text" id="judul" placeholder="Judul pengumuman...">
      <textarea id="isi" placeholder="Isi pengumuman..."></textarea>
      <button class="btn-add" onclick="tambahPengumuman()">+ Publikasikan</button>
    </div>

    <div class="section-header">
      <h2>Semua Pengumuman</h2>
    </div>

    <div class="list-grid" id="pengumumanList">
      <div class="spinner"></div>
    </div>
  </div>

  <script>
    async function tambahPengumuman() {
      const judul = document.getElementById('judul').value.trim();
      const isi   = document.getElementById('isi').value.trim();
      if (!judul || !isi) return alert('Judul dan isi tidak boleh kosong.');
      await supabaseClient.from('announcements').insert([{ judul, isi, tanggal: new Date().toISOString() }]);
      document.getElementById('judul').value = '';
      document.getElementById('isi').value = '';
      loadPengumuman();
    }

    async function loadPengumuman() {
      const { data } = await supabaseClient.from('announcements').select('*').order('tanggal', { ascending: false });
      const el = document.getElementById('pengumumanList');
      if (!data || !data.length) {
        el.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>Belum ada pengumuman.</p></div>';
        return;
      }
      el.innerHTML = data.map((item, i) => `
        <div class="jadwal-card" style="animation-delay:${i*.05}s">
          <div class="jadwal-card-body">
            <h3>${item.judul}</h3>
            <p>${item.isi}</p>
            <span class="tag tag-indigo">📢 Pengumuman</span>
            ${item.tanggal ? `<span style="font-size:11px;color:var(--muted2);margin-top:4px;display:block">🕐 ${formatWIB(item.tanggal)}</span>` : ''}
          </div>
          <button class="btn-danger" onclick="hapusPengumuman(${item.id})">Hapus</button>
        </div>`).join('');
    }

    async function hapusPengumuman(id) {
      if (!confirm('Hapus pengumuman ini?')) return;
      await supabaseClient.from('announcements').delete().eq('id', id);
      loadPengumuman();
    }

    async function logout() {
      const ssidPlain = localStorage.getItem('ssid')
      if (ssidPlain) {
        try {
          const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(ssidPlain))
          const ssidHashed = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('')
          await supabaseClient.from('users').update({ ssid: null, expired_at: null }).eq('ssid', ssidHashed)
        } catch(e) { console.error('logout:', e) }
      }
      localStorage.removeItem('ssid')
      location.href = 'login.html'
    }
    loadPengumuman();
  </script>
  <script>
    // ── Sidebar mobile toggle ──
    const btn      = document.getElementById('hamburgerBtn')
    const sidebar  = document.querySelector('.sidebar')
    const overlay  = document.getElementById('sidebarOverlay')

    function openSidebar() {
      sidebar.classList.add('open')
      overlay.classList.add('open')
      btn.classList.add('open')
      document.body.style.overflow = 'hidden'
    }

    function closeSidebar() {
      sidebar.classList.remove('open')
      overlay.classList.remove('open')
      btn.classList.remove('open')
      document.body.style.overflow = ''
    }

    btn?.addEventListener('click', () =>
      sidebar.classList.contains('open') ? closeSidebar() : openSidebar()
    )
    overlay?.addEventListener('click', closeSidebar)

    // Tutup sidebar saat nav item diklik di mobile
    document.querySelectorAll('.sidebar li').forEach(li =>
      li.addEventListener('click', () => {
        if (window.innerWidth <= 768) closeSidebar()
      })
    )
  </script>
</body>
</html>
